aid: bekhealth
name: BEKHealth
description: 'BEKhealth is a clinical research technology company whose BEKplatform
  applies a BERT-based deep-learning model to structured and unstructured electronic
  health record data — physician notes, pathology reports, clinical endpoints — to
  power trial feasibility, patient matching and research-grade real-world data for
  sponsors, CROs and research site networks. The company markets 25+ proprietary EHR
  adapters reaching roughly 80% of the EHR market (Epic, Cerner, athenahealth, NextGen,
  eClinicalWorks, Veradigm, Greenway, ModMed, DrChrono, Elation, AdvancedMD, Flatiron,
  OpenEMR and others), a longitudinal patient graph mapped to an ontology of more than
  24 million clinical terms, and the BEKnetwork of 200+ research sites covering 30M+
  patient records. Delivery is enterprise SaaS — sold direct and through AWS Marketplace,
  and embedded in partner platforms such as CRIO eSource/CTMS. BEKhealth operates a
  documentation portal at docs.bekhealth.com and an Auth0 OpenID Connect issuer at
  auth.bekhealth.com, but publishes no public developer portal, API reference or
  machine-readable specification; the documented route to the platform is a demo
  request and a contracted onboarding with BAAs and DUAs.'
