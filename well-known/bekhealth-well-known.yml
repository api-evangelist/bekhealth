method: probed
source: live probes of /.well-known/* on every BEKhealth host
description: >-
  Index of the /.well-known/ paths probed across BEKhealth hosts. The only
  well-known documents BEKhealth serves anonymously are the OpenID Connect and
  OAuth 2.0 authorization-server metadata published by its Auth0 custom-domain
  issuer at auth.bekhealth.com. The marketing site (www.bekhealth.com) serves no
  well-known documents at all, and the documentation host (docs.bekhealth.com)
  redirects every path — including /.well-known/* — into the Auth0 login.
hosts:
